name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: homeo26
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237c3aed&color_dots=%23e6e8ef,%23a78bfa,%232dd4bf,%2314b8a6,%23ec4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161922,%237c3aed,%2314b8a6,%232dd4bf,%23ec4899

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
